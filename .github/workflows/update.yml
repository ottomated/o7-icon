name: Update Icons
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - id: create_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.create_token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          cache: true
          runtime: node@lts
          install: true
          require-lockfile: true

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Download icons
        id: download
        run: |
          exit_code=0
          pnpm download || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.download.outputs.exit_code == '0'
        run: pnpm package

      - name: Commit
        if: steps.download.outputs.exit_code == '0'
        run: |
          git add .

          git config --local user.email "o7-icon@users.noreply.github.com"
          git config --local user.name "o7-icon[bot]"
          git commit -m "ci: Update icons"
          pnpm version patch

      - name: Publish
        if: steps.download.outputs.exit_code == '0'
        run: |
          pnpm publish
          git push
